<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080910">
  <meta name="description" content="Разработчик Velheor">
  <title>Разработчик Velheor</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #080910; }
    body { margin: 0; min-height: 100svh; overflow: hidden; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
    .scene { position: relative; isolation: isolate; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; overflow: hidden; }
    .aurora { position: absolute; z-index: -2; width: min(95vw, 1050px); height: min(70vw, 650px); border-radius: 50%; filter: blur(85px); opacity: .3; background: conic-gradient(from 45deg, #6847ff, #0999ba, #6136ce, #b6409d, #6847ff); animation: aurora 24s ease-in-out infinite alternate; }
    .scene::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 5%, #080910 76%); }
    .stars { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #c3cfff; box-shadow: 0 0 9px #b6baff; opacity: 0; animation: twinkle var(--duration) ease-in-out var(--delay) infinite; }
    h1 { margin: 0; text-align: center; font-weight: 500; animation: arrive 1.6s cubic-bezier(.16,1,.3,1) both; }
    .label { display: block; margin-bottom: 18px; padding-left: .38em; font-size: clamp(12px, 1.5vw, 16px); font-weight: 400; letter-spacing: .38em; text-transform: uppercase; color: #c2bfd5; animation: breathe 6s ease-in-out infinite; }
    .name { position: relative; display: block; font-size: clamp(66px, 16vw, 190px); line-height: 1.1; font-weight: 650; letter-spacing: -.065em; padding-right: .065em; animation: float 8s ease-in-out infinite; }
    .letters { display: inline-block; background: linear-gradient(110deg, #fff 0%, #d5ccff 16%, #9ceaff 32%, #c4b5fd 48%, #ffa8dc 64%, #d5ccff 80%, #fff 100%); background-size: 300% 100%; background-clip: text; -webkit-background-clip: text; color: transparent; animation: shimmer 12s ease-in-out infinite; filter: drop-shadow(0 0 28px #8e6cff38); }
    .name::after { content: ''; position: absolute; height: 1px; left: 16%; right: 16%; bottom: -24px; background: linear-gradient(90deg, transparent, #a7cfff99, #d4a5ff99, transparent); box-shadow: 0 0 20px #9f8aff55; animation: breathe 6s ease-in-out infinite; }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes breathe { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    @keyframes aurora { from { transform: translate(-7%, -3%) rotate(-18deg) scale(.9); } to { transform: translate(7%, 5%) rotate(35deg) scale(1.12); } }
    @keyframes twinkle { 0%,100% { opacity: .08; transform: translateY(0); } 50% { opacity: .65; transform: translateY(-12px); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(22px); filter: blur(12px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .star { opacity: .25; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="aurora" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <h1><span class="label">Разработчик</span><span class="name"><span class="letters">Velheor</span></span></h1>
  </main>
  <script>
    const sky = document.querySelector('.stars');
    let seed = 137;
    const random = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (let i = 0; i < 44; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.style.cssText = `left:${random() * 100}%;top:${random() * 100}%;--duration:${4 + random() * 7}s;--delay:-${random() * 12}s`;
      sky.appendChild(star);
    }
  </script>
</body>
</html>
